<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCS SHOES - Premium Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f7}
.top{background:#000;color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:bold;letter-spacing:1px}
.container{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px}
@media(max-width:850px){.container{grid-template-columns:1fr}}
.left{background:#fff;border-radius:24px;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,0.1)}
.main-img{width:100%;height:600px;object-fit:contain;border-radius:16px;background:#fff}
@media(max-width:850px){.main-img{height:400px}}
.thumbs{display:flex;gap:15px;margin-top:20px}
.thumb{width:100px;height:100px;border-radius:14px;border:3px solid #eee;overflow:hidden;cursor:pointer;background:#fff}
.thumb.active{border-color:#000}
.thumb img{width:100%;height:100%;object-fit:cover}
.right{background:#fff;border-radius:24px;padding:35px;box-shadow:0 20px 60px rgba(0,0,0,0.1)}
.badge{background:#000;color:#fff;padding:8px 14px;border-radius:30px;font-size:12px;font-weight:bold;display:inline-block}
.title{font-size:38px;font-weight:800;margin:15px 0 5px;line-height:1.1}
.rating{color:#ff9800;font-weight:bold;margin:10px 0}
.price-row{display:flex;align-items:center;gap:15px;margin:20px 0}
.price{font-size:42px;font-weight:900}
.cut{color:#999;text-decoration:line-through;font-size:20px}
.off{background:#ff3b30;color:#fff;padding:6px 12px;border-radius:8px;font-weight:800}
.detail-box{background:#f9f9f9;padding:20px;border-radius:16px;margin:20px 0}
.detail-box h4{margin-bottom:12px;font-size:16px}
.detail-box p{font-size:14px;color:#555;line-height:1.6;margin:6px 0}
.size-row

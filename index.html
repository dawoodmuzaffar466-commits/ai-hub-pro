<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCS SHOES - Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
.header{background:#000;color:#fff;padding:15px;text-align:center}
.product{max-width:500px;margin:20px auto;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
.main-img{width:100%;height:400px;object-fit:contain;background:#fff;padding:20px}
.colors{display:flex;justify-content:center;gap:10px;padding:15px}
.color-btn{width:70px;height:70px;border-radius:10px;border:3px solid #ddd;cursor:pointer;overflow:hidden}
.color-btn.active{border-color:#000}
.color-btn img{width:100%;height:100%;object-fit:cover}
.info{padding:20px}.title{font-size:24px;font-weight:bold}
.price{font-size:28px;color:#e60000;font-weight:bold}
.old-price{text-decoration:line-through;color:#888;margin-left:10px;font-size:18px}
.btn{width:100%;background:#000;color:#fff;padding:15px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<div class="header"><h2>LCS SHOES STORE</h2><p>Cash on Delivery</p></div>
<div class="product">
<img id="mainImage" class="main-img" src="IMG-20261013-WA5833.jpg">
<div class="colors">
<div class="color-btn active" onclick="changeColor('IMG-20261013-WA5833.jpg',this)"><img src="IMG-20261013-WA5833.jpg"></div>
<div class="color-btn" onclick="changeColor('IMG-20261013-WA2663.jpg',this)"><img src="IMG-20261013-WA2663.jpg"></div>
<div class="color-btn" onclick="changeColor('IMG-20261013-WA8895.jpg',this)"><img src="IMG-20261013-WA8895.jpg"></div>
<div class="color-btn" onclick="changeColor('IMG-20261013-WA4114.jpg',this)"><img src="IMG-20261013-WA4114.jpg"></div>
</div>
<div class="info">
<div class="title">Skecher Slip-Ins - Art-013</div>
<div><span class="price">Rs. 4899</span><span class="old-price">Rs. 5500</span></div>
<button class="btn" onclick="orderNow()">ORDER NOW - WhatsApp</button>
</div>
</div>
<script>
function changeColor(src,el){document.getElementById('mainImage').src=src;document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function orderNow(){window.open('https://wa.me/923001234567?text=Order LCS SHOES Art-013 Rs.4899','_blank');}
</script>
</body>
</html>

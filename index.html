<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f5}
.top{background:#00e676;text-align:center;padding:8px;font-weight:800;font-size:12px}
.head{background:#000;color:#fff;padding:14px;text-align:center}
.box{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.hero{width:100%;height:400px;background:#fff;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;height:100%;object-fit:contain}
.info{padding:16px}
.price{font-size:28px;font-weight:900}
.btn{background:#000;color:#fff;width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:900;margin-top:16px}
.dot{width:40px;height:40px;border-radius:50%;display:inline-block;margin:5px;border:2px solid #ddd}
.dot.active{border-color:#000}
.sz{display:inline-block;padding:8px 16px;border:1px solid #ddd;border-radius:8px;margin:4px}
.sz.active{background:#000;color:#fff}
</style>
</head>
<body>
<div class="top">FREE DELIVERY KASUR - 0304-7672836</div>
<div class="head"><h1>LCS SHOES KASUR - Art-013</h1></div>
<div class="box">
<div class="hero"><img id="main" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="shoe"></div>
<div class="info">
<h2 id="title">Art-013 Slip-Ins - Beige</h2>
<p style="color:#666;font-size:13px;margin:6px 0">Breathable | Comfort | Size 40-44</p>
<div class="price">Rs. 4,200 <span style="color:#999;text-decoration:line-through;font-size:16px">Rs. 5,500</span></div>
<p style="font-weight:700;margin-top:14px;font-size:13px">COLOUR</p>
<div>
<span class="dot active" style="background:#e8dcc5" onclick="c('Beige',this)"></span>
<span class="dot" style="background:#111" onclick="c('Black',this)"></span>
<span class="dot" style="background:#6b7280" onclick="c('Grey',this)"></span>
<span class="dot" style="background:#1e3a5f" onclick="c('Navy Blue',this)"></span>
</div>
<p style="font-weight:700;margin-top:12px;font-size:13px">SIZE</p>
<div>
<span class="sz" onclick="s(this)">40</span>
<span class="sz" onclick="s(this)">41</span>
<span class="sz active" onclick="s(this)">42</span>
<span class="sz" onclick="s(this)">43</span>
<span class="sz" onclick="s(this)">44</span>
</div>
<button class="btn" onclick="order()">ORDER ON WHATSAPP</button>
<p style="text-align:center;font-size:12px;color:#666;margin-top:10px">Cash on Delivery - 2 Days Return</p>
</div>
</div>
</div>
<script>
let col='Beige',siz='42';
function c(n,el){col=n;document.getElementById('title').innerText='Art-013 Slip-Ins - '+n;document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));el.classList.add('active')}
function s(el){document.querySelectorAll('.sz').forEach(d=>d.classList.remove('active'));el.classList.add('active');siz=el.innerText}
function order(){let m=`Salam LCS SHOES!%0AOrder: Art-013%0AColour: ${col}%0ASize: ${siz}%0APrice: 4200`;window.open('https://wa.me/923047672836?text='+m,'_blank')}
</script>
</body>
</html>

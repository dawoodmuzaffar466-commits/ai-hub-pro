<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCS SHOES - Premium Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#f5f5f7}
.top{background:#000;color:#fff;text-align:center;padding:12px;font-weight:800;letter-spacing:1px;font-size:14px}
.header{max-width:1250px;margin:0 auto;background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.logo{font-weight:900;font-size:24px;letter-spacing:2px}
.main{max-width:1250px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.left{background:#fff;border-radius:24px;padding:30px;box-shadow:0 15px 50px rgba(0,0,0,.08)}
.main-img{width:100%;height:650px;object-fit:contain;background:#fff;border-radius:16px}
@media(max-width:900px){.main-img{height:420px}}
.thumbs{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
.thumb{width:115px;height:115px;border-radius:16px;border:3px solid #eee;overflow:hidden;cursor:pointer;background:#fff;transition:.2s}
.thumb.active{border-color:#000;transform:scale(1.05)}
.thumb img{width:100%;height:100%;object-fit:cover}
.right{background:#fff;border-radius:24px;padding:34px;box-shadow:0 15px 50px rgba(0,0,0,.08)}
.badge{background:#000;color:#fff;padding:8px 16px;border-radius:30px;font-size:12px;font-weight:800;display:inline-block}
.title{font-size:42px;font-weight:900;line-height:1.1;margin:18px 0 8px}
.stars{color:#ff9800;font-weight:700;font-size:14px;margin-bottom:6px}
.price-row{display:flex;align-items:center;gap:14px;margin:22px 0}
.price{font-size:46px;font-weight:900}
.cut{color:#999;text-decoration:line-through;font-size:20px}
.off{background:#ff3b30;color:#fff;padding:7px 12px;border-radius:10px;font-weight:900;font-size:14px}
.details{background:#f9fafb;padding:20px;border-radius:18px;margin:20px 0;border:1px solid #eee}
.details h4{margin-bottom:12px;font-size:15px}

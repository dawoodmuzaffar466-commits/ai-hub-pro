<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI HUB PRO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#070710;color:#fff}header{display:flex;justify-content:space-between;padding:18px 5%;background:#121223;border-bottom:1px solid #222}.logo{font-weight:800;font-size:22px}.logo span{color:#6c5cff}.hero{text-align:center;padding:40px 5%}.hero h1{font-size:32px}.hero span{color:#8a7cff}.grid{padding:20px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#121223;border:1px solid #222238;border-radius:16px;padding:18px;cursor:pointer}.card:hover{border-color:#6c5cff}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#070710;z-index:99;overflow:auto;padding:20px}.modal.active{display:block}.box{max-width:600px;margin:20px auto;background:#15151e;border:1px solid #333;border-radius:16px;padding:20px}textarea{width:100%;background:#0a0a14;border:1px solid #2a2a4a;border-radius:12px;color:#fff;padding:12px;min-height:100px;margin:10px 0;outline:none}.btn{width:100%;background:#6c5cff;border:none;color:#fff;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}.img{width:100%;border-radius:12px;margin-top:12px}</style></head><body><header><div class="logo">AI HUB <span>PRO</span></div><div style="background:#6c5cff;padding:6px 12px;border-radius:20px;font-size:12px">✅ Live - No 404</div></header><div class="hero"><h1>All Daily <span>AI Tools</span> in One Hub</h1><p style="color:#888;margin-top:8px">Tap to Open - 100% Working Inside Same Page</p></div><div class="grid"><div class="card" onclick="openM('imgM')"><div style="font-size:28px">🎨</div><h3>AI Image Generator</h3><p style="color:#888;font-size:12px">Text to Image - FREE</p><small style="color:#10b981">✅ CLICK TO OPEN</small></div><div class="card" onclick="openM('humM')"><div style="font-size:28px">📝</div><h3>AI Humanizer</h3><p style="color:#888;font-size:12px">Bypass AI Detector</p><small style="color:#10b981">✅ CLICK TO OPEN</small></div></div><div id="imgM" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2>🎨 AI Image Generator</h2><button onclick="closeM('imgM')" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:20px">✕ Close</button></div><textarea id="pr" placeholder="e.g. A cute cat wearing sunglasses, 3D"></textarea><button class="btn" id="ib" onclick="gen()">✨ GENERATE</button><div id="iout"></div></div></div><div id="humM" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2>📝 AI Humanizer</h2><button onclick="closeM('humM')" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:20px">✕ Close</button></div><textarea id="hin" placeholder="Paste AI text here..."></textarea><button class="btn" onclick="humanize()">✨ HUMANIZE</button><textarea id="hout" placeholder="Humanized text will appear here..." style="min-height:140px"></textarea><button class="btn" style="background:#222;margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById('hout').value);alert('Copied!')">Copy Text</button></div></div><script>function openM(id){document.getElementById(id).classList.add('active')}function closeM(id){document.getElementById(id).classList.remove('active')}function gen(){let p=document.getElementById('pr').value.trim();if(!p)return alert('Prompt likho!');let b=document.getElementById('ib');b.innerText='⏳ Generating...';let seed=Math.floor(Math.random()*999999);let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?seed=${seed}&width=512&height=512&nologo=true`;document.getElementById('iout').innerHTML=`<img class=img src=${url} onload="document.getElementById('ib').innerText='✨ GENERATE'"><br><a href=${url} target=_blank style=color:#6c5cff>Download Image</a>`}function humanize(){let t=document.getElementById('hin').value;if(!t)return alert('Text paste karo!');t=t.replace(/Moreover,|Furthermore,|In conclusion,/gi,"");t=t.replace(/It is important to note that/gi,"You should know");t=t.replace(/utilize/gi,"use");t=t.replace(/—/g,", ");t="So here's the thing. "+t+" This is what actually works.";document.getElementById('hout').value=t}</script></body></html>
